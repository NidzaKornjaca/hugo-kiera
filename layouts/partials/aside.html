<aside class="meta-aside">
  <time class="post-date" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" | safeHTML }}">{{ .Date.Format .Site.Params.dateFormat }}</time>
  {{ if .Params.tags }}
  |
    {{ range $i, $t := .Params.tags }}
        <a href="{{ relLangURL ( printf "tags/%s" ( $t | urlize ) ) }}">#{{ $t }}</a>
    {{ end }}
  {{ end }}
</aside>
